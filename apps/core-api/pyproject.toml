[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "balgres-it-core-api"
version = "0.1.0"
description = "Core API del hub de IT de Balgres"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    # ─── módulos (path al submódulo montado dentro del contenedor) ───
    "balgres-it-inventario @ file:///app/modules/inventario/backend",
    "balgres-it-contacts @ file:///app/modules/contacts/backend",
    "balgres-it-redes @ file:///app/modules/redes/backend",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
