name: balgres_it_shell
description: Shell Flutter que agrega los módulos de balgres-it-hub
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.3.0
  dio: ^5.7.0
  flutter_riverpod: ^2.5.1

  balgres_it_inventario:
    path: ../../modules/inventario/frontend

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
