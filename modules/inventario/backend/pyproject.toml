[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "balgres-it-inventario"
version = "0.1.0"
description = "Módulo de inventario de TI para balgres-it-hub"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "sqlmodel>=0.0.22",
    "pydantic>=2.9",
    "python-multipart>=0.0.9",
    "pandas>=2.2.2",
    "openpyxl>=3.1.2",
    "fpdf2>=2.7.9",
    "segno>=1.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["inventario*"]
